services:
  # 1. Backend Express API
  - type: web
    name: humanhub-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: AI_SERVICE_URL
        sync: false

  # 2. AI Microservice (FastAPI + Python ML)
  - type: web
    name: humanhub-ai
    runtime: python
    plan: free
    rootDir: ai_services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_CACHE_DIR
        value: /tmp/models
      - key: ENABLE_C2PA_VERIFICATION
        value: "true"
